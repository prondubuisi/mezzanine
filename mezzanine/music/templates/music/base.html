{% load static i18n %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <strong><a href="{% url 'home' %}">{{ site_name }}</a></strong>
    <nav>
      <a href="{% url 'home' %}">{% trans "Home" %}</a>
      <a href="{% url 'music_search' %}">{% trans "Search" %}</a>
      <a href="{% url 'music_library' %}">{% trans "Library" %}</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>{{ disclaimer }}</small></footer>
</body>
</html>

{% load i18n %}
<form class="editable-form editable-island"
      method="post"
      action="{% url "edit" %}"
      hx-post="{% url "edit" %}"
      hx-target="this"
      hx-swap="outerHTML"
      {% if editable_form.is_multipart %}enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% for field in editable_form %}
    <p{% if field.is_hidden %} class="editable-hidden"{% endif %}>
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}
        <span class="helptext">{{ field.help_text }}</span>
        {% endif %}
    </p>
    {% endfor %}
    <div class="editable-actions">
        <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
        <button type="button"
                class="btn btn-default"
                hx-get="{{ display_url }}"
                hx-target="closest .editable-island"
                hx-swap="outerHTML">{% trans "Cancel" %}</button>
    </div>
</form>

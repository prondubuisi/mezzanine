[build-system]
# <1.28 still installs on Python 3.8/3.9; PR-009 raises the floor.
requires = ["hatchling>=1.26,<1.28"]
build-backend = "hatchling.build"

[project]
# Publish as nova-cms; import path stays mezzanine (KD1).
name = "nova-cms"
dynamic = ["version"]
description = "An open source content management platform built using the Django framework."
readme = "README.rst"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Stephen McDonald", email = "stephen.mc@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 2.2",
    "Framework :: Django :: 3.0",
    "Framework :: Django :: 3.1",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django-contrib-comments>=2.0",
    "django>=2.2,<6",
    "tzlocal>=2",
    "bleach[css]>=5",
    "beautifulsoup4>=4.5.3",
    "requests>=2.1.0",
    "requests-oauthlib>=1.3",
    "pillow>=7",
    "chardet>=4",
    "pytz>=2021.1",
    "filebrowser_safe>=1.1.1",
    "grappelli_safe>=1.1.1",
]

[project.optional-dependencies]
testing = [
    "pytest-django>=4,<5",
    "pytest-cov>=2",
    "requirements-parser>=0.11",
]
codestyle = [
    "flake8>=3,<4",
    "black==22.3.0",
    "isort>=5,<6",
    "pyupgrade>=2,<3",
]

[project.urls]
Homepage = "http://mezzanine.jupo.org/"

[project.scripts]
mezzanine-project = "mezzanine.bin.mezzanine_project:create_project"
nova-project = "mezzanine.bin.mezzanine_project:create_project"

[tool.hatch.version]
path = "mezzanine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mezzanine"]

[tool.black]
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.tox
    | \.venv
    | build
    | dist
  )/
)
'''

[tox]
envlist =
    py{312,313,314}-dj{52,60,61}
    package
    lint

[testenv]
# Run test suite
usedevelop = true
deps =
    .[testing]
    dj52: Django>=5.2, <5.3
    dj60: Django>=6.0, <6.1
    dj61: Django>=6.1, <6.2
commands =
    pytest --basetemp="{envtmpdir}" --junitxml="junit/TEST-{envname}.xml" {posargs}

[testenv:package]
# Check package integrity and compatibility with PyPI
deps =
    build
    twine
skip_install = true
commands =
    python -m build --outdir="{envtmpdir}/dist"
    twine check "{envtmpdir}/dist/*"
    python -c "from pathlib import Path; dist=Path(r'{envtmpdir}/dist'); wheels=list(dist.glob('*.whl')); sdists=list(dist.glob('*.tar.gz')); assert wheels and sdists, (wheels, sdists); w=wheels[0].name; s=sdists[0].name; assert w.startswith('nova_cms-') and 'py3-none-any' in w and 'py2.py3' not in w, w; assert s.startswith('nova_cms-'), s"

[testenv:lint]
skip_install = true
deps = .[codestyle]
commands =
    ruff check .

[testenv:format-check]
# Not in envlist / CI. Fails on ~80 files until an isolated `ruff format`
# commit; flip this into [testenv:lint] after that lands.
skip_install = true
deps = .[codestyle]
commands =
    ruff format --check .

[testenv:format]
# This env is not run by default. It's provided here for you to easily
# autoformat code by running `tox -e format`
skip_install = true
deps = .[codestyle]
commands =
    ruff check --fix .
    ruff format .

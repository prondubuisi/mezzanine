[tox]
envlist =
    py{38,39,310,311,312,313,314}-dj{22,30,31,32,40,41,42,50,51,52}
    package
    lint

[testenv]
# Run test suite
usedevelop = true
deps =
    .[testing]
    dj22: Django>=2.2, <3
    dj30: Django>=3.0, <3.1
    dj31: Django>=3.1, <3.2
    dj32: Django>=3.2, <3.3
    dj40: Django>=4.0, <4.1
    dj41: Django>=4.1, <4.2
    dj42: Django>=4.2, <4.3
    dj50: Django>=5.0, <5.1
    dj51: Django>=5.1, <5.2
    dj52: Django>=5.2, <5.3
commands =
    pytest --basetemp="{envtmpdir}" --junitxml="junit/TEST-{envname}.xml" {posargs}

[testenv:package]
# Check package integrity and compatibility with PyPI
deps =
    build
    twine
skip_install = true
commands =
    python -m build --outdir="{envtmpdir}/dist"
    twine check "{envtmpdir}/dist/*"
    python -c "from pathlib import Path; dist=Path(r'{envtmpdir}/dist'); wheels=list(dist.glob('*.whl')); sdists=list(dist.glob('*.tar.gz')); assert wheels and sdists, (wheels, sdists); w=wheels[0].name; s=sdists[0].name; assert w.startswith('nova_cms-') and 'py3-none-any' in w and 'py2.py3' not in w, w; assert s.startswith('nova_cms-'), s"

[testenv:lint]
skip_install = true
deps = .[codestyle]
commands =
    isort --diff --atomic .
    black --check .
    flake8 .

[testenv:pyupgrade]
# Run pyupgrade with non-zero exit code (notice `+` at the end of command)
skip_install = true
allowlist_externals = sh
deps = .[codestyle]
commands =
    sh -c 'find . \( -path ./.tox -o -path ./.venv \) -prune -false -o -name "*.py" -exec pyupgrade --py38-plus \{\} +'

[testenv:format]
# This env is not run by default. It's provided here for you to easily
# autoformat code by running `tox -e format`
skip_install = true
allowlist_externals = sh
deps = .[codestyle]
commands =
    sh -c 'find . \( -path ./.tox -o -path ./.venv \) -prune -false -o -name "*.py" -exec pyupgrade --py38-plus \{\} \;'
    isort --atomic .
    black .

[flake8]
# Configured to match black
ignore =
    E203
    W503
    E731
max-line-length = 88
exclude =
    migrations
    .tox
    .git
    .eggs
    *.egg-info
    .venv
    build
    dist

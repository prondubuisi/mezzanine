# Publish nova-cms to PyPI via Trusted Publishing (OIDC).
# No long-lived PYPI_TOKEN. Configure a PyPI trusted publisher for
# this repository, workflow filename publish.yml, and environment pypi.
#
# Gate is a published GitHub Release or a v* tag — not
# github.repository_owner == 'stephenmcd', so this fork can publish.

name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nova-cms
    permissions:
      id-token: write  # mandatory for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A GitHub Release that creates a v* tag fires both `release`
          # and `push` events; skip rather than fail the second upload.
          skip-existing: true

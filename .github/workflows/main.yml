name: Test and release

# Fires on all incoming commits. workflow_dispatch lets us re-run from a
# branch when Actions has never executed on a fork (zero-run cold start).
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:

  # Test all supported Python & Django versions
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2 LTS
          - tox-env: "py312-dj52"
            python-version: "3.12"
          - tox-env: "py313-dj52"
            python-version: "3.13"
          - tox-env: "py314-dj52"
            python-version: "3.14"
          # Django 6.0
          - tox-env: "py312-dj60"
            python-version: "3.12"
          - tox-env: "py313-dj60"
            python-version: "3.13"
          - tox-env: "py314-dj60"
            python-version: "3.14"
          # Django 6.1
          - tox-env: "py312-dj61"
            python-version: "3.12"
          - tox-env: "py313-dj61"
            python-version: "3.13"
          - tox-env: "py314-dj61"
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -U pip tox
      - name: Run tests
        run: tox -e ${{ matrix.tox-env }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v3
        with:
          report_paths: '**/junit/TEST-*.xml'

  # Lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install tox -U pip
      - name: Lint
        run: tox -e package -e lint

  # Scan declared + installed runtime deps for known CVEs.
  # Does not re-expand the living test matrix (py312–314 × dj52/60/61).
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        run: |
          python -m pip install -U pip pip-audit
          python -m pip install -e .
      - name: Audit dependencies
        run: pip-audit --skip-editable

  # Create a new semantic release (GitHub notes + version bump).
  # Owner check is for semantic-release on the original repo only — do
  # not use it as a PyPI gate. Trusted Publishing lives in publish.yml
  # and runs on this fork for published releases / v* tags.
  release:
    if: github.repository_owner == 'stephenmcd'
    needs: [test, lint, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
      - uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 18
          extra_plugins: |
            @semantic-release/exec@6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # Build and deploy docs
  docs:
    if: github.ref == 'refs/heads/stable'
    needs: release
    name: build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e . && pip install sphinx
      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
        with:
          semver_only: true
      - name: Get release tag
        run: echo "RELEASE_TAG=${{ steps.get-latest-tag.outputs.tag }}" >> $GITHUB_ENV
      - name: Build docs
        run: sphinx-build -b html docs docs/build
      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: gh-pages
          build_dir: docs/build
          fqdn: mezzanine.jupo.org
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
